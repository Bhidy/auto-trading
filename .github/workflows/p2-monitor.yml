name: "P2 Capitol Shadow — Intraday Monitor"

on:
  schedule:
    # Hourly during market: 10:30AM-3:30PM ET = 14:30-19:30 UTC
    - cron: "30 14 * * 1-5"
    - cron: "30 15 * * 1-5"
    - cron: "30 16 * * 1-5"
    - cron: "30 17 * * 1-5"
    - cron: "30 18 * * 1-5"
    - cron: "30 19 * * 1-5"
    # EST winter coverage
    - cron: "30 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p2-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # Pinned + fail-soft (supply-chain hardening, 2026-06 audit).
          npm install -g @anguslin/mcp-capitol-trades@1.0.1 || echo "P2 MCP install failed — monitor continues; scan runs dark"

      - name: Create Alpaca config
        run: |
          cat > political-copy-bot/config/alpaca_config.json << 'CONF'
          {
            "api_key": "${{ secrets.P2_API_KEY }}",
            "api_secret": "${{ secrets.P2_API_SECRET }}",
            "base_url": "https://paper-api.alpaca.markets",
            "data_url": "https://data.alpaca.markets"
          }
          CONF

      - name: Check market open
        id: market
        run: |
          python3 -c "
          import requests
          h = {'APCA-API-KEY-ID': '${{ secrets.P2_API_KEY }}', 'APCA-API-SECRET-KEY': '${{ secrets.P2_API_SECRET }}'}
          clock = requests.get('https://paper-api.alpaca.markets/v2/clock', headers=h).json()
          is_open = clock.get('is_open', False)
          print(f'Market open: {is_open}')
          with open('$GITHUB_OUTPUT', 'a') as f:
            f.write(f'is_open={str(is_open).lower()}\n')
          "

      - name: Run monitor
        if: steps.market.outputs.is_open == 'true'
        run: |
          cd "$GITHUB_WORKSPACE/political-copy-bot"
          export PYTHONPATH="$GITHUB_WORKSPACE/political-copy-bot/scripts"
          python3 scripts/politician_bot.py monitor

      - name: Sync data to dashboard for Vercel deploy
        if: always()
        run: |
          mkdir -p dashboard/data dashboard/event-driven-bot/data dashboard/political-copy-bot/data dashboard/journal dashboard/config
          cp data/*.json dashboard/data/ 2>/dev/null || true
          cp event-driven-bot/data/*.json dashboard/event-driven-bot/data/ 2>/dev/null || true
          cp political-copy-bot/data/*.json dashboard/political-copy-bot/data/ 2>/dev/null || true
          cp journal/*.json dashboard/journal/ 2>/dev/null || true
          cp config/risk_limits.json config/watchlist.json dashboard/config/ 2>/dev/null || true
          echo "Dashboard data synced"

      - name: Commit state
        if: always()
        run: |
          bash scripts/commit_and_push.sh "P2: monitor" political-copy-bot/data political-copy-bot/journal
