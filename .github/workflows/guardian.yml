name: "Guardian — Trading Catch-Up & Self-Heal"

# ───────────────────────────────────────────────────────────────────────────
# WHY THIS EXISTS (read before editing)
#
# GitHub Actions only throttles `schedule:` (cron) triggers — they are
# best-effort and get delayed (10–40 min) or dropped under platform load. We
# have observed ALL of a portfolio's staggered morning crons slip together,
# leaving a trading day un-traded until an operator manually dispatched.
#
# `repository_dispatch` / `workflow_dispatch` (API-triggered) runs are NOT
# subject to that throttle — they start within seconds. Guardian is therefore
# the single, freshness-aware catch-up that ANY reliable external scheduler can
# poke via one `repository_dispatch` (event_type: trading-catchup). It checks
# each portfolio's committed state and, only for the portfolios that have NOT
# yet run today (and only while the market is open), runs that portfolio's
# session INLINE using the exact same tested entry points as the native
# trading workflows. It is fully idempotent:
#   * a portfolio that already ran today is skipped (freshness gate), and
#   * every order carries a deterministic client_order_id, so even a race with
#     a late native cron cannot double-place.
#
# Layers of defense (independent failure domains):
#   L1  native staggered trading crons          (p1/p2/p3-trading.yml)
#   L2  external scheduler -> repository_dispatch -> THIS workflow   (reliable)
#   L3  THIS workflow's own backup schedule      (extra native chances, offset)
#   L4  failure-alert.yml + heartbeat.yml        (alert if anything still slips)
#
# This file touches NO existing workflow. Worst case it fails in isolation and
# the failure watchdog reports it; the money path is untouched.
# ───────────────────────────────────────────────────────────────────────────

on:
  # L3 — backup native schedule at minute offsets distinct from the trading
  # crons, covering ~10:25am–1:25pm ET (EDT & EST). Catch-up never opens NEW
  # positions in the last hours of the session.
  schedule:
    - cron: "25 14 * * 1-5"
    - cron: "55 14 * * 1-5"
    - cron: "25 15 * * 1-5"
    - cron: "55 15 * * 1-5"
    - cron: "25 16 * * 1-5"
    - cron: "55 16 * * 1-5"
    - cron: "25 17 * * 1-5"
    - cron: "55 17 * * 1-5"
    # EST winter coverage (one hour later in UTC).
    - cron: "25 18 * * 1-5"
    - cron: "55 18 * * 1-5"
  # L2 — the reliable external trigger pokes exactly this.
  repository_dispatch:
    types: [trading-catchup]
  workflow_dispatch:

permissions:
  contents: write
  actions: read      # P1 freshness: is a p1-trading run for today still active?

concurrency:
  group: guardian
  cancel-in-progress: false

jobs:
  catchup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      # D1 (audit 2026-10-23): a queued `repository_dispatch` checks out the
      # commit from DISPATCH time. Back-to-back dispatches (the external
      # scheduler fires several per morning) therefore ran their freshness gate
      # against state from BEFORE the previous Guardian committed, re-ran P2,
      # placed duplicate copy-sells (CB, HD) and the commit then overwrote newer
      # trade_log rows. Sync to the latest main BEFORE any gate reads state.
      - name: Sync to latest origin/main
        run: |
          git fetch --no-tags --depth=1 origin main
          git reset --hard origin/main
          echo "State base: $(git rev-parse --short HEAD)"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install -g @anguslin/mcp-capitol-trades@1.0.1 || echo "P2 MCP install failed (P2 catch-up runs on the House index only)"

      - name: Create Alpaca configs (P1/P2/P3)
        run: |
          cat > config/alpaca_config.json << 'CONF'
          {
            "api_key": "${{ secrets.P1_API_KEY }}",
            "api_secret": "${{ secrets.P1_API_SECRET }}",
            "base_url": "https://paper-api.alpaca.markets",
            "data_url": "https://data.alpaca.markets"
          }
          CONF
          mkdir -p political-copy-bot/config event-driven-bot/config
          cat > political-copy-bot/config/alpaca_config.json << 'CONF'
          {
            "api_key": "${{ secrets.P2_API_KEY }}",
            "api_secret": "${{ secrets.P2_API_SECRET }}",
            "base_url": "https://paper-api.alpaca.markets",
            "data_url": "https://data.alpaca.markets"
          }
          CONF
          cat > event-driven-bot/config/alpaca_config.json << 'CONF'
          {
            "api_key": "${{ secrets.P3_API_KEY }}",
            "api_secret": "${{ secrets.P3_API_SECRET }}",
            "base_url": "https://paper-api.alpaca.markets",
            "data_url": "https://data.alpaca.markets"
          }
          CONF

      # One freshness rule, used by the initial assessment AND re-checked
      # immediately before each portfolio runs. A portfolio is FRESH if its
      # run-only artifact is dated the current ET session (or later) in EITHER
      # the working tree or the LATEST origin/main (re-fetched on every check,
      # so a native cron or another Guardian that committed while this job was
      # running is seen). Exit 0 = fresh (skip), 1 = stale (run).
      #   P1: data/signals.json            (written only by morning-research)
      #       OR a P1 trading-session order (p1mom-/p1core-/p1-) at the BROKER
      #       today (ground truth; survives a late/lost state commit) OR a
      #       p1-trading run for today still queued/in progress (gh run list).
      #   P2: strategy_conformance.json     (written only by a market-open scan;
      #       portfolio_state.json is ALSO written by the hourly monitor, so it
      #       read fresh on days the scan never ran)
      #   P3: event-driven-bot signals.json (written only by morning-scan)
      - name: Install freshness gate
        run: |
          cat > "$RUNNER_TEMP/guardian_fresh.py" << 'PY'
          import datetime, json, os, subprocess, sys
          from zoneinfo import ZoneInfo

          SOURCES = {
              "p1": ("data/signals.json", ("timestamp",)),
              "p2": ("political-copy-bot/data/strategy_conformance.json", ("timestamp",)),
              "p3": ("event-driven-bot/data/signals.json", ("timestamp", "generated_at")),
          }
          ET = ZoneInfo("America/New_York")

          def et_date(ts):
              try:
                  dt = datetime.datetime.fromisoformat(str(ts).replace("Z", "+00:00"))
              except ValueError:
                  return str(ts)[:10]
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=datetime.timezone.utc)
              return dt.astimezone(ET).strftime("%Y-%m-%d")

          def stamp(text, keys):
              try:
                  d = json.loads(text)
              except Exception:
                  return ""
              if not isinstance(d, dict):
                  return ""
              for k in keys:
                  if d.get(k):
                      return et_date(d[k])
              return ""

          P1_SESSION_PREFIXES = ("p1mom-", "p1core-", "p1-")   # trading-session orders only

          def p1_broker_traded_today():
              """GROUND TRUTH: did a P1 trading session place an order this ET
              session? Reads the broker (cheap GET /v2/orders?after=ET-midnight).
              Catches a native run that traded but whose state commit is late or
              lost. Monitor exits (p1stop/p1tp/p1time/p1cap) do not count."""
              try:
                  import requests
                  with open("config/alpaca_config.json") as f:
                      cfg = json.load(f)
              except Exception:
                  return False                       # no creds here: signals rule only
              start = (datetime.datetime.now(ET).replace(hour=0, minute=0, second=0, microsecond=0)
                       .astimezone(datetime.timezone.utc).isoformat())
              try:
                  r = requests.get(cfg["base_url"] + "/v2/orders", timeout=15,
                                   headers={"APCA-API-KEY-ID": cfg["api_key"],
                                            "APCA-API-SECRET-KEY": cfg["api_secret"]},
                                   params={"status": "all", "after": start, "limit": 500})
                  r.raise_for_status()
                  orders = r.json() or []
              except Exception as e:
                  print(f"P1 broker order check unavailable ({e}) — signals rule only")
                  return False
              hits = [o for o in orders
                      if str(o.get("client_order_id") or "").startswith(P1_SESSION_PREFIXES)]
              if hits:
                  print(f"P1 broker: {len(hits)} trading-session order(s) today")
              return bool(hits)

          def p1_trading_run_active(today):
              """A native p1-trading run created this ET session that is still
              queued/in progress will trade itself — don't race it."""
              if not os.environ.get("GH_TOKEN"):
                  return False
              try:
                  r = subprocess.run(["gh", "run", "list", "--workflow", "p1-trading.yml",
                                      "--limit", "10", "--json", "status,createdAt"],
                                     capture_output=True, text=True, timeout=30, check=False)
                  runs = json.loads(r.stdout or "[]") if r.returncode == 0 else []
              except Exception:
                  return False
              live = [x for x in runs if x.get("status") in
                      ("queued", "in_progress", "waiting", "pending", "requested")
                      and et_date(x.get("createdAt")) == today]
              if live:
                  print(f"P1: {len(live)} p1-trading run(s) for today still active")
              return bool(live)

          pid = sys.argv[1]
          path, keys = SOURCES[pid]
          today = datetime.datetime.now(ET).strftime("%Y-%m-%d")
          try:
              local = stamp(open(path).read(), keys)
          except OSError:
              local = ""
          subprocess.run(["git", "fetch", "-q", "--no-tags", "--depth=1", "origin", "main"],
                         check=False, timeout=60)
          r = subprocess.run(["git", "show", f"origin/main:{path}"],
                             capture_output=True, text=True, check=False)
          remote = stamp(r.stdout, keys) if r.returncode == 0 else ""
          fresh = max(local, remote) >= today
          if not fresh and pid == "p1":
              fresh = p1_broker_traded_today() or p1_trading_run_active(today)
          print(f"{pid.upper()} session={today} local={local or 'none'} "
                f"origin/main={remote or 'none'} -> {'FRESH (skip)' if fresh else 'STALE (run)'}")
          sys.exit(0 if fresh else 1)
          PY

      - name: Assess market + per-portfolio freshness
        id: assess
        run: |
          IS_OPEN=$(python3 - << 'PY'
          import json, requests
          with open("config/alpaca_config.json") as f:
              cfg = json.load(f)
          h = {"APCA-API-KEY-ID": cfg["api_key"], "APCA-API-SECRET-KEY": cfg["api_secret"]}
          try:
              clock = requests.get("https://paper-api.alpaca.markets/v2/clock", headers=h, timeout=15).json()
              print(str(bool(clock.get("is_open", False))).lower())
          except Exception:
              print("false")   # fail closed: treat market as CLOSED
          PY
          )
          echo "market_open=$IS_OPEN"
          echo "is_open=$IS_OPEN" >> "$GITHUB_OUTPUT"
          for P in p1 p2 p3; do
            if python3 "$RUNNER_TEMP/guardian_fresh.py" "$P"; then
              echo "${P}_stale=false" >> "$GITHUB_OUTPUT"
            else
              echo "${P}_stale=true" >> "$GITHUB_OUTPUT"
            fi
          done

      # Each catch-up RE-CHECKS freshness against the latest origin/main right
      # before running: the earlier assessment can be minutes old by now.
      - name: P1 catch-up (only if market open AND not run today)
        id: p1catch
        if: steps.assess.outputs.is_open == 'true' && steps.assess.outputs.p1_stale == 'true'
        continue-on-error: true
        run: |
          cd "$GITHUB_WORKSPACE"
          if python3 "$RUNNER_TEMP/guardian_fresh.py" p1; then
            echo "P1 became fresh since assessment — skipping."; exit 0
          fi
          echo "::warning::P1 had not run today — Guardian running its morning session now."
          export PYTHONPATH="$GITHUB_WORKSPACE/scripts"
          python3 scripts/autonomous_runner.py morning-research
          python3 scripts/autonomous_runner.py trading-session

      - name: P3 catch-up (only if market open AND not run today)
        id: p3catch
        if: steps.assess.outputs.is_open == 'true' && steps.assess.outputs.p3_stale == 'true'
        continue-on-error: true
        run: |
          cd "$GITHUB_WORKSPACE"
          if python3 "$RUNNER_TEMP/guardian_fresh.py" p3; then
            echo "P3 became fresh since assessment — skipping."; exit 0
          fi
          echo "::warning::P3 had not run today — Guardian running its pipeline now."
          cd "$GITHUB_WORKSPACE/event-driven-bot"
          export PYTHONPATH="$GITHUB_WORKSPACE/event-driven-bot/scripts"
          DAY=$(TZ=America/New_York date +%u)
          if [ "$DAY" = "1" ]; then
            python3 scripts/event_driven_bot.py weekly-screen || true
          fi
          python3 scripts/event_driven_bot.py morning-scan
          python3 scripts/event_driven_bot.py trading-session
          python3 scripts/event_driven_bot.py news-scan || true

      - name: P2 catch-up (only if market open AND not run today)
        id: p2catch
        if: steps.assess.outputs.is_open == 'true' && steps.assess.outputs.p2_stale == 'true'
        continue-on-error: true
        run: |
          cd "$GITHUB_WORKSPACE"
          if python3 "$RUNNER_TEMP/guardian_fresh.py" p2; then
            echo "P2 became fresh since assessment — skipping."; exit 0
          fi
          echo "::warning::P2 had not run today — Guardian running its scan now."
          cd "$GITHUB_WORKSPACE/political-copy-bot"
          export PYTHONPATH="$GITHUB_WORKSPACE/political-copy-bot/scripts"
          python3 scripts/politician_bot.py scan

      - name: Guardian summary
        if: always()
        run: |
          echo "=== GUARDIAN CATCH-UP SUMMARY ==="
          echo "Market open: ${{ steps.assess.outputs.is_open }}"
          echo "P1 stale (ran catch-up): ${{ steps.assess.outputs.p1_stale }}"
          echo "P2 stale (ran catch-up): ${{ steps.assess.outputs.p2_stale }}"
          echo "P3 stale (ran catch-up): ${{ steps.assess.outputs.p3_stale }}"
          echo "Trigger: ${{ github.event_name }}"
          echo "=== END ==="

      - name: Sync data to dashboard for Vercel deploy
        if: always()
        run: |
          mkdir -p dashboard/data dashboard/event-driven-bot/data dashboard/political-copy-bot/data dashboard/journal dashboard/config
          cp data/*.json dashboard/data/ 2>/dev/null || true
          cp event-driven-bot/data/*.json dashboard/event-driven-bot/data/ 2>/dev/null || true
          cp political-copy-bot/data/*.json dashboard/political-copy-bot/data/ 2>/dev/null || true
          cp journal/*.json dashboard/journal/ 2>/dev/null || true
          cp config/risk_limits.json config/watchlist.json dashboard/config/ 2>/dev/null || true
          echo "Dashboard data synced"

      - name: Commit state
        if: always()
        run: |
          bash scripts/commit_and_push.sh "Guardian: catch-up self-heal" data journal event-driven-bot/data event-driven-bot/journal political-copy-bot/data political-copy-bot/journal

      # Anti-silent-failure: each catch-up step is `continue-on-error: true` so a
      # crash in one portfolio cannot block the others. But that also means a
      # crashed catch-up would otherwise let this workflow conclude SUCCESS — a
      # silent miss. This final gate inspects each step's true `outcome` (which
      # `continue-on-error` does not mask) and fails the workflow if ANY catch-up
      # crashed, so failure-alert.yml raises an alert the same day. It runs AFTER
      # the commit so partial state is never lost. A skipped step (market closed
      # or portfolio already fresh) has outcome 'skipped', not 'failure', so the
      # happy path and clean no-trade days are unaffected.
      - name: Surface any swallowed catch-up failure
        if: always()
        run: |
          FAILED=""
          [ "${{ steps.p1catch.outcome }}" = "failure" ] && FAILED="$FAILED P1"
          [ "${{ steps.p3catch.outcome }}" = "failure" ] && FAILED="$FAILED P3"
          [ "${{ steps.p2catch.outcome }}" = "failure" ] && FAILED="$FAILED P2"
          if [ -n "$FAILED" ]; then
            echo "::error::Guardian catch-up CRASHED for:$FAILED — failing the workflow so the watchdog alerts (state was already committed)."
            exit 1
          fi
          echo "No catch-up crashed — all attempted portfolios completed cleanly."
