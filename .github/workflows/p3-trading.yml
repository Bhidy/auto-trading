name: "P3 Cautious Sniper — Daily Trading Pipeline"

on:
  schedule:
    # 9:50 AM ET. EDT (summer) = 13:50 UTC, EST (winter) = 14:50 UTC.
    # Multiple staggered fires guard against GitHub Actions schedule delays/skips.
    # Idempotency guard below prevents double-trading via signals file date check.
    - cron: "50 13 * * 1-5"
    - cron: "5 14 * * 1-5"
    - cron: "20 14 * * 1-5"
    - cron: "50 14 * * 1-5"
    - cron: "5 15 * * 1-5"
    - cron: "20 15 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "full"
        type: choice
        options: [full, weekly-screen, morning-scan, trading-session, news-scan, eod-journal, weekly-review]

permissions:
  contents: write

concurrency:
  group: p3-trading
  cancel-in-progress: false

jobs:
  trading:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create Alpaca config
        run: |
          cat > event-driven-bot/config/alpaca_config.json << 'CONF'
          {
            "api_key": "${{ secrets.P3_API_KEY }}",
            "api_secret": "${{ secrets.P3_API_SECRET }}",
            "base_url": "https://paper-api.alpaca.markets",
            "data_url": "https://data.alpaca.markets"
          }
          CONF

      - name: Check market open
        id: market
        run: |
          python3 -c "
          import json
          with open('event-driven-bot/config/alpaca_config.json') as f:
              cfg = json.load(f)
          import requests
          h = {'APCA-API-KEY-ID': cfg['api_key'], 'APCA-API-SECRET-KEY': cfg['api_secret']}
          clock = requests.get('https://paper-api.alpaca.markets/v2/clock', headers=h, timeout=10).json()
          is_open = clock.get('is_open', False)
          print(f'Market open: {is_open}')
          with open('$GITHUB_OUTPUT', 'a') as f:
            f.write(f'is_open={str(is_open).lower()}\n')
          "

      - name: Dedup — skip if today already traded
        id: dedup
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          ALREADY=false
          if [ -f event-driven-bot/data/signals.json ]; then
            SIG_DATE=$(python3 -c "import json; d=json.load(open('event-driven-bot/data/signals.json')); print((d.get('timestamp') or d.get('generated_at') or '')[:10])" 2>/dev/null || echo "")
            if [ "$SIG_DATE" = "$TODAY" ]; then
              ALREADY=true
              echo "Today's P3 session already ran (signals.json date=$SIG_DATE). Skipping."
            fi
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ALREADY=false
            echo "workflow_dispatch — bypassing dedup."
          fi
          echo "already_ran=$ALREADY" >> $GITHUB_OUTPUT

      - name: Weekly screen (Mondays only)
        if: steps.market.outputs.is_open == 'true' && steps.dedup.outputs.already_ran != 'true' && (github.event.schedule || github.event.inputs.mode == 'full' || github.event.inputs.mode == 'weekly-screen')
        run: |
          DAY=$(date -u +%u)
          if [ "$DAY" = "1" ] || [ "${{ github.event.inputs.mode }}" = "weekly-screen" ]; then
            cd "$GITHUB_WORKSPACE/event-driven-bot"
            export PYTHONPATH="$GITHUB_WORKSPACE/event-driven-bot/scripts"
            python3 scripts/event_driven_bot.py weekly-screen
          fi

      - name: Morning scan
        if: steps.market.outputs.is_open == 'true' && steps.dedup.outputs.already_ran != 'true' && (github.event.schedule || github.event.inputs.mode == 'full' || github.event.inputs.mode == 'morning-scan')
        run: |
          cd "$GITHUB_WORKSPACE/event-driven-bot"
          export PYTHONPATH="$GITHUB_WORKSPACE/event-driven-bot/scripts"
          python3 scripts/event_driven_bot.py morning-scan

      - name: Trading session
        if: steps.market.outputs.is_open == 'true' && steps.dedup.outputs.already_ran != 'true' && (github.event.schedule || github.event.inputs.mode == 'full' || github.event.inputs.mode == 'trading-session')
        run: |
          cd "$GITHUB_WORKSPACE/event-driven-bot"
          export PYTHONPATH="$GITHUB_WORKSPACE/event-driven-bot/scripts"
          python3 scripts/event_driven_bot.py trading-session

      - name: News scan
        if: steps.market.outputs.is_open == 'true' && steps.dedup.outputs.already_ran != 'true' && (github.event.schedule || github.event.inputs.mode == 'full' || github.event.inputs.mode == 'news-scan')
        run: |
          cd "$GITHUB_WORKSPACE/event-driven-bot"
          export PYTHONPATH="$GITHUB_WORKSPACE/event-driven-bot/scripts"
          # No || true here: a news-scan crash must FAIL the job so the
          # failure-alert watchdog fires. The || true masking hid an
          # AttributeError that kept the event tranche from ever trading
          # (audit 2026-07-04, defect D1). Data sync + commit below run
          # under if: always(), so state is still persisted on failure.
          python3 scripts/event_driven_bot.py news-scan

      - name: Sync data to dashboard for Vercel deploy
        if: always()
        run: |
          mkdir -p dashboard/data dashboard/event-driven-bot/data dashboard/political-copy-bot/data dashboard/journal dashboard/config
          cp data/*.json dashboard/data/ 2>/dev/null || true
          cp event-driven-bot/data/*.json dashboard/event-driven-bot/data/ 2>/dev/null || true
          cp political-copy-bot/data/*.json dashboard/political-copy-bot/data/ 2>/dev/null || true
          cp journal/*.json dashboard/journal/ 2>/dev/null || true
          cp config/risk_limits.json config/watchlist.json dashboard/config/ 2>/dev/null || true
          echo "Dashboard data synced"

      - name: Commit state
        if: always()
        run: |
          bash scripts/commit_and_push.sh "P3: trading pipeline" event-driven-bot/data event-driven-bot/journal
