name: "Heartbeat — Daily Run Watchdog"

# Runs after the full trading + EOD window. Detects any portfolio that failed
# to run/commit fresh state today (on trading days) and raises a GitHub issue
# (and optional Slack alert) so a silent failure can never go unnoticed again.
on:
  schedule:
    # After all EOD windows (EDT EOD ends ~20:50 UTC, EST ~21:50 UTC).
    - cron: "30 22 * * 1-5"   # 6:30pm ET EDT
    - cron: "30 23 * * 1-5"   # backup, 6:30pm ET EST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run heartbeat check
        id: hb
        env:
          P1_API_KEY: ${{ secrets.P1_API_KEY }}
          P1_API_SECRET: ${{ secrets.P1_API_SECRET }}
        run: python3 scripts/heartbeat.py

      - name: Raise GitHub issue on stale portfolio or reconciliation drift
        if: steps.hb.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.hb.outputs.summary }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          TITLE="🚨 Heartbeat alert on ${TODAY}"
          # Avoid duplicate issues for the same day.
          EXISTING=$(gh issue list --state open --search "in:title ${TITLE}" --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            gh issue create --title "$TITLE" \
              --label "automation,alert" \
              --body "$(printf '%s\n\n---\nAuto-generated by the heartbeat watchdog. Check the failed workflow run and re-trigger the affected portfolio.' "$SUMMARY")" \
            || gh issue create --title "$TITLE" \
              --body "$(printf '%s\n\n---\nAuto-generated by the heartbeat watchdog.' "$SUMMARY")"
          else
            echo "Issue already open for $TODAY — not duplicating."
          fi

      - name: Optional Slack alert
        if: steps.hb.outputs.alert == 'true' && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SUMMARY: ${{ steps.hb.outputs.summary }}
        run: |
          payload=$(python3 -c "import json,os; print(json.dumps({'text': '🚨 Auto Trading heartbeat alert\n' + os.environ['SUMMARY']}))")
          curl -sf -X POST -H 'Content-Type: application/json' -d "$payload" "$SLACK_WEBHOOK_URL" || echo "Slack post failed (non-fatal)"
