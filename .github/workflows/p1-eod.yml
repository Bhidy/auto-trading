name: "P1 Self Improving Brain — End of Day"

on:
  schedule:
    # 4:15 PM ET EOD journal. EDT=20:15 UTC, EST=21:15 UTC.
    # Multiple staggered fires guard against GitHub Actions schedule delays/skips.
    - cron: "15 20 * * 1-5"
    - cron: "30 20 * * 1-5"
    - cron: "45 20 * * 1-5"
    - cron: "15 21 * * 1-5"
    - cron: "30 21 * * 1-5"
    - cron: "45 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p1-eod
  cancel-in-progress: false

jobs:
  eod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create Alpaca config
        run: |
          cat > config/alpaca_config.json << 'CONF'
          {
            "api_key": "${{ secrets.P1_API_KEY }}",
            "api_secret": "${{ secrets.P1_API_SECRET }}",
            "base_url": "https://paper-api.alpaca.markets",
            "data_url": "https://data.alpaca.markets"
          }
          CONF

      - name: Run end-of-day journal
        run: |
          cd "$GITHUB_WORKSPACE"
          export PYTHONPATH="$GITHUB_WORKSPACE/scripts"
          python3 scripts/autonomous_runner.py end-of-day-journal

      - name: Save daily snapshot to Supabase
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 scripts/save_to_supabase.py \
            --portfolio-id portfolio_1 \
            --state-file data/portfolio_state.json \
            --api-key "${{ secrets.P1_API_KEY }}" \
            --api-secret "${{ secrets.P1_API_SECRET }}"

      - name: Sync data to dashboard for Vercel deploy
        if: always()
        run: |
          mkdir -p dashboard/data dashboard/event-driven-bot/data dashboard/political-copy-bot/data dashboard/journal dashboard/config
          cp data/*.json dashboard/data/ 2>/dev/null || true
          cp event-driven-bot/data/*.json dashboard/event-driven-bot/data/ 2>/dev/null || true
          cp political-copy-bot/data/*.json dashboard/political-copy-bot/data/ 2>/dev/null || true
          cp journal/*.json dashboard/journal/ 2>/dev/null || true
          cp config/risk_limits.json config/watchlist.json dashboard/config/ 2>/dev/null || true
          echo "Dashboard data synced"

      - name: Commit state
        if: always()
        run: |
          git config user.name "Auto Trading Bot"
          git config user.email "bot@autotrading.local"
          git add data/ journal/ -f 2>/dev/null || true
          git add dashboard/data/ dashboard/event-driven-bot/data/ dashboard/political-copy-bot/data/ dashboard/journal/ dashboard/config/ -f 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "P1: $(date -u +%Y-%m-%d) end-of-day journal"
            PUSHED=1
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then
                echo "Push succeeded on attempt $i"
                PUSHED=0
                break
              fi
              echo "Push attempt $i failed, retrying in 5s..."
              sleep 5
            done
            if [ "$PUSHED" -ne 0 ]; then
              echo "WARNING: All push attempts failed — state saved locally but not synced to remote"
            fi
          fi
