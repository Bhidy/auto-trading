name: "P3 Cautious Sniper — End of Day"

on:
  schedule:
    # 4:20 PM ET = 20:20 UTC (M-F)
    - cron: "20 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-pipeline
  cancel-in-progress: false

jobs:
  eod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests

      - name: Create Alpaca config
        run: |
          cat > event-driven-bot/config/alpaca_config.json << 'CONF'
          {
            "api_key": "${{ secrets.P3_API_KEY }}",
            "api_secret": "${{ secrets.P3_API_SECRET }}",
            "base_url": "https://paper-api.alpaca.markets",
            "data_url": "https://data.alpaca.markets"
          }
          CONF

      - name: Run EOD journal
        run: |
          cd "$GITHUB_WORKSPACE/event-driven-bot"
          export PYTHONPATH="$GITHUB_WORKSPACE/event-driven-bot/scripts"
          python3 scripts/event_driven_bot.py eod-journal

      - name: Commit state
        if: always()
        run: |
          git config user.name "Auto Trading Bot"
          git config user.email "bot@autotrading.local"
          git add event-driven-bot/data/ event-driven-bot/journal/ -f 2>/dev/null || true
          git diff --staged --quiet || git commit -m "P3: $(date -u +%Y-%m-%d) end-of-day"
          for i in 1 2 3; do git pull --rebase origin main 2>/dev/null; git push && break || sleep 5; done
