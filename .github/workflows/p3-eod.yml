name: "P3 Cautious Sniper — End of Day"

on:
  schedule:
    # 4:20 PM ET EOD journal. EDT=20:20 UTC, EST=21:20 UTC.
    # Multiple staggered fires guard against GitHub Actions schedule delays/skips.
    - cron: "20 20 * * 1-5"
    - cron: "35 20 * * 1-5"
    - cron: "50 20 * * 1-5"
    - cron: "20 21 * * 1-5"
    - cron: "35 21 * * 1-5"
    - cron: "50 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p3-eod
  cancel-in-progress: false

jobs:
  eod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create Alpaca config
        run: |
          cat > event-driven-bot/config/alpaca_config.json << 'CONF'
          {
            "api_key": "${{ secrets.P3_API_KEY }}",
            "api_secret": "${{ secrets.P3_API_SECRET }}",
            "base_url": "https://paper-api.alpaca.markets",
            "data_url": "https://data.alpaca.markets"
          }
          CONF

      - name: Run EOD journal
        run: |
          cd "$GITHUB_WORKSPACE/event-driven-bot"
          export PYTHONPATH="$GITHUB_WORKSPACE/event-driven-bot/scripts"
          python3 scripts/event_driven_bot.py eod-journal

      - name: Save daily snapshot to Supabase
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Optional telemetry — must NEVER fail the trading/EOD job.
          python3 scripts/save_to_supabase.py \
            --portfolio-id portfolio_3 \
            --state-file event-driven-bot/data/bot_state.json \
            --api-key "${{ secrets.P3_API_KEY }}" \
            --api-secret "${{ secrets.P3_API_SECRET }}" || echo "Supabase snapshot skipped/failed (non-fatal)"

      - name: Sync data to dashboard for Vercel deploy
        if: always()
        run: |
          mkdir -p dashboard/data dashboard/event-driven-bot/data dashboard/political-copy-bot/data dashboard/journal dashboard/config
          cp data/*.json dashboard/data/ 2>/dev/null || true
          cp event-driven-bot/data/*.json dashboard/event-driven-bot/data/ 2>/dev/null || true
          cp political-copy-bot/data/*.json dashboard/political-copy-bot/data/ 2>/dev/null || true
          cp journal/*.json dashboard/journal/ 2>/dev/null || true
          cp config/risk_limits.json config/watchlist.json dashboard/config/ 2>/dev/null || true
          echo "Dashboard data synced"

      - name: Commit state
        if: always()
        run: |
          bash scripts/commit_and_push.sh "P3: end-of-day" event-driven-bot/data event-driven-bot/journal
