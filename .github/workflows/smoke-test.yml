name: "Deploy & Smoke Test"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-smoke
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        run: |
          cd dashboard
          # Link to existing project (CI lacks .vercel/project.json since it's gitignored)
          mkdir -p .vercel
          cat > .vercel/project.json << 'PROJ'
          {
            "projectId": "prj_Ig61I6uR0q614j6xGS07EQCkIyZ3",
            "orgId": "team_Gqpf3K97tjrOCyIlEnGjWCOE"
          }
          PROJ
          npm install --silent
          echo "Deploying dashboard to Vercel production..."
          npx vercel --prod --force --token "${{ secrets.VERCEL_TOKEN }}" --yes 2>&1
          echo "Deploy completed"

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wait for Vercel propagation
        run: sleep 12

      - name: Smoke test production API
        run: |
          PROD_URL="https://autotradingportfolios.vercel.app"
          FAILURES=0

          echo "=== POST-DEPLOY SMOKE TEST ==="
          echo "Target: $PROD_URL"
          echo ""

          echo "--- Health Check ---"
          HEALTH=$(curl -sf "$PROD_URL/api/health" || echo '{"error":"FAIL"}')
          echo "$HEALTH" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          if data.get('error'):
              print('FAIL: Health endpoint returned error')
              sys.exit(1)
          files = data.get('files', {})
          critical = ['tradeLog', 'signals', 'state']
          for f in critical:
              fdata = files.get(f, {})
              if not fdata.get('exists'):
                  print(f'FAIL: {f} does not exist on Vercel')
                  sys.exit(1)
              else:
                  print(f'OK: {f} exists')
          " || FAILURES=$((FAILURES + 1))
          echo ""

          echo "--- P1 Trade Data ---"
          curl -sf "$PROD_URL/api/portfolio/portfolio_1/details" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          tl = len(data.get('trade_log', []))
          pos = len(data.get('positions', {}))
          print(f'trade_log={tl} positions={pos}')
          if tl == 0:
              print('FAIL: trade_log is empty')
              sys.exit(1)
          else:
              latest = data['trade_log'][-1]
              print(f'  Latest: {latest[\"symbol\"]} {latest.get(\"timestamp\",\"\")[:10]}')
          " || FAILURES=$((FAILURES + 1))
          echo ""

          echo "--- P2 Trade Data ---"
          curl -sf "$PROD_URL/api/portfolio/portfolio_2/details" | python3 -c "
          import json, sys
          print(f'P2 trade_log=' + str(len(json.load(sys.stdin).get('trade_log', []))))
          " || FAILURES=$((FAILURES + 1))
          echo ""

          echo "--- P3 Trade Data ---"
          curl -sf "$PROD_URL/api/portfolio/portfolio_3/details" | python3 -c "
          import json, sys
          print(f'P3 trade_log=' + str(len(json.load(sys.stdin).get('trade_log', []))))
          " || FAILURES=$((FAILURES + 1))
          echo ""

          echo "=== SMOKE TEST: $FAILURES failures ==="
          if [ $FAILURES -gt 0 ]; then
            echo "DEPLOYMENT VERIFICATION FAILED"
            exit 1
          fi
          echo "DEPLOYMENT HEALTHY — all checks passed"
