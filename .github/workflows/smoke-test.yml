name: "Deploy & Smoke Test"

# Robust production deploy for the dashboard.
#
# Vercel's native Git integration was NOT actually wired to this repo (every
# historical production deploy in `vercel ls` was a manual CLI deploy by the
# owner), so pushes did NOT auto-deploy and the old smoke job gave a false
# green by polling the PREVIOUS deployment. This workflow now performs a real
# deploy via the Vercel CLI (using the existing VERCEL_TOKEN secret), then
# verifies the freshly-deployed build — the post-deploy safety net mandated by
# CLAUDE.md.
#
# Triggers on CODE changes only (not data-file commits from the trading bots,
# which would otherwise cause dozens of redundant deploys per day; live data is
# served from Alpaca at request time, the committed JSON is only a fallback).
on:
  push:
    branches: [main]
    paths:
      - "dashboard/public/**"
      - "dashboard/server.js"
      - "dashboard/api/**"
      - "dashboard/vercel.json"
      - "dashboard/package.json"
      - "dashboard/package-lock.json"
      - "dashboard/build.sh"
      - ".github/workflows/smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-smoke
  cancel-in-progress: false

env:
  # Non-sensitive project identifiers (from dashboard/.vercel/project.json).
  VERCEL_ORG_ID: team_Gqpf3K97tjrOCyIlEnGjWCOE
  VERCEL_PROJECT_ID: prj_Ig61I6uR0q614j6xGS07EQCkIyZ3

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel production environment
        working-directory: dashboard
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build (production)
        working-directory: dashboard
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt to production
        working-directory: dashboard
        run: |
          URL=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "Deployed: $URL"
          echo "DEPLOY_URL=$URL" >> "$GITHUB_ENV"

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Smoke test production API (verify freshly-deployed build)
        run: |
          PROD_URL="https://autotradingportfolios.vercel.app"
          echo "=== POST-DEPLOY SMOKE TEST ==="
          echo "Target: $PROD_URL"

          # The deploy job already aliased production; poll briefly for edge propagation.
          HEALTH_OK=0
          for attempt in $(seq 1 12); do
            HEALTH=$(curl -sf "$PROD_URL/api/health" 2>/dev/null || echo '{"error":"FAIL"}')
            if echo "$HEALTH" | python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
          except Exception:
              sys.exit(1)
          if data.get('error'):
              sys.exit(1)
          files = data.get('files', {})
          for f in ['tradeLog', 'signals', 'state']:
              if not files.get(f, {}).get('exists'):
                  sys.exit(1)
          print('OK: health + critical files present')
          " 2>/dev/null; then
              HEALTH_OK=1
              break
            fi
            echo "  attempt $attempt/12 — not ready yet, waiting 10s..."
            sleep 10
          done

          if [ "$HEALTH_OK" -ne 1 ]; then
            echo "FAIL: health endpoint never became healthy after ~2min"
            exit 1
          fi

          FAILURES=0
          echo "--- P1 Trade Data ---"
          curl -sf "$PROD_URL/api/portfolio/portfolio_1/details" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          tl = len(data.get('trade_log', []))
          print(f'trade_log={tl} positions={len(data.get(\"positions\", {}))}')
          if tl == 0:
              print('FAIL: P1 trade_log is empty'); sys.exit(1)
          " || FAILURES=$((FAILURES + 1))

          echo "--- P2 Trade Data ---"
          curl -sf "$PROD_URL/api/portfolio/portfolio_2/details" | python3 -c "
          import json, sys
          print('P2 trade_log=' + str(len(json.load(sys.stdin).get('trade_log', []))))
          " || FAILURES=$((FAILURES + 1))

          echo "--- P3 Trade Data ---"
          curl -sf "$PROD_URL/api/portfolio/portfolio_3/details" | python3 -c "
          import json, sys
          print('P3 trade_log=' + str(len(json.load(sys.stdin).get('trade_log', []))))
          " || FAILURES=$((FAILURES + 1))

          echo "=== SMOKE TEST: $FAILURES failures ==="
          if [ "$FAILURES" -gt 0 ]; then
            echo "DEPLOYMENT VERIFICATION FAILED"
            exit 1
          fi
          echo "DEPLOYMENT HEALTHY — all checks passed"
