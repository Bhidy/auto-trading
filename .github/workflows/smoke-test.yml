name: "Post-Deploy Smoke Test"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-test
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Smoke test production API
        run: |
          PROD_URL="https://autotradingportfolios.vercel.app"
          FAILURES=0

          echo "=== POST-DEPLOY SMOKE TEST ==="
          echo "Target: $PROD_URL"
          echo ""

          # 1. Health endpoint
          echo "--- Health Check ---"
          HEALTH=$(curl -sf "$PROD_URL/api/health" || echo '{"error":"FAIL"}')
          echo "$HEALTH" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          if data.get('error'):
              print('FAIL: Health endpoint returned error')
              sys.exit(1)
          files = data.get('files', {})
          critical = ['tradeLog', 'signals', 'state', 'learningReport']
          for f in critical:
              fdata = files.get(f, {})
              if not fdata.get('exists'):
                  print(f'FAIL: {f} does not exist on Vercel')
                  sys.exit(1)
              else:
                  print(f'OK: {f} exists, size={fdata.get(\"size\",0)} bytes')
          " || FAILURES=$((FAILURES + 1))
          echo ""

          # 2. P1 details
          echo "--- P1 Portfolio Details ---"
          P1=$(curl -sf "$PROD_URL/api/portfolio/portfolio_1/details" || echo '{}')
          echo "$P1" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          tl = len(data.get('trade_log', []))
          pos = len(data.get('positions', {}))
          eq = data.get('account', {}).get('equity', 'N/A')
          print(f'trade_log={tl} positions={pos} equity={eq}')
          if tl == 0:
              print('WARNING: trade_log is empty — data files may not be deployed')
          else:
              latest = data['trade_log'][-1]
              print(f'  Latest: {latest[\"symbol\"]} {latest[\"side\"]} @ {latest.get(\"entry_price\",0)}')
          " || FAILURES=$((FAILURES + 1))
          echo ""

          # 3. P2 details
          echo "--- P2 Portfolio Details ---"
          curl -sf "$PROD_URL/api/portfolio/portfolio_2/details" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          tl = len(data.get('trade_log', []))
          print(f'P2 trade_log={tl}')
          " || FAILURES=$((FAILURES + 1))
          echo ""

          # 4. P3 details
          echo "--- P3 Portfolio Details ---"
          curl -sf "$PROD_URL/api/portfolio/portfolio_3/details" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          tl = len(data.get('trade_log', []))
          print(f'P3 trade_log={tl}')
          " || FAILURES=$((FAILURES + 1))
          echo ""

          echo "=== SMOKE TEST COMPLETE: $FAILURES failures ==="
          if [ $FAILURES -gt 0 ]; then
            echo "DEPLOYMENT VERIFICATION FAILED — data files may be missing on Vercel"
            exit 1
          fi
          echo "ALL CHECKS PASSED — deployment is healthy"
