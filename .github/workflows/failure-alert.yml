name: "Failure Alert — Workflow Watchdog"

# Centralized "never fail silently" guard. Fires the moment ANY scheduled
# automation workflow concludes with failure, and opens a deduped GitHub issue
# (+ optional Slack). This complements heartbeat.yml: heartbeat catches a run
# that never happened (stale state); this catches a run that happened and
# crashed — immediately, instead of waiting for the evening watchdog.
#
# 100% cloud-native: GitHub Actions + GitHub issues + optional Slack webhook.
# No PC, no Claude, no manual step. Trading crons are staggered + idempotent,
# so a single failed run is auto-retried by the next scheduled fire regardless.
on:
  workflow_run:
    workflows:
      - "P1 Self Improving Brain — Daily Trading"
      - "P1 Self Improving Brain — Intraday Monitor"
      - "P1 Self Improving Brain — End of Day"
      - "P1 Self Improving Brain — Weekly Review"
      - "P2 Capitol Shadow — Daily Scan & Trade"
      - "P2 Capitol Shadow — Intraday Monitor"
      - "P3 Cautious Sniper — Daily Trading Pipeline"
      - "P3 Cautious Sniper — Intraday Monitor"
      - "P3 Cautious Sniper — End of Day"
      - "Guardian — Trading Catch-Up & Self-Heal"
      - "Market Data — Daily History Collector"
      - "Heartbeat — Daily Run Watchdog"
      - "Readiness Engine v2 — Daily Report"
      # Audit 2026-10-23 D3: the quality gate and the production deploy were
      # unwatched — a red CI or a failed deploy raised nothing.
      - "CI — Lint & Tests"
      - "Deploy & Smoke Test"
    types: [completed]

permissions:
  issues: write
  contents: read
  actions: read

concurrency:
  group: failure-alert-${{ github.event.workflow_run.name }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  alert:
    # Alert on every run that did NOT finish its work: failure, cancelled and
    # timed_out (audit 2026-10-23 D3 — 34 P2 scans killed by the 15-min job
    # timeout concluded `cancelled` and raised nothing). success / skipped /
    # neutral are ignored.
    # Only main: a red CI on a feature/PR branch is the author's signal, not
    # a production alert.
    if: >-
      github.event.workflow_run.head_branch == 'main' && (
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled' ||
      github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      WF_NAME: ${{ github.event.workflow_run.name }}
      WF_URL: ${{ github.event.workflow_run.html_url }}
      WF_BRANCH: ${{ github.event.workflow_run.head_branch }}
      WF_RUN: ${{ github.event.workflow_run.run_number }}
      WF_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      WF_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      # A run that was cancelled while still QUEUED (GitHub keeps one pending
      # run per concurrency group and cancels the older pending one) never did
      # any work and is not an incident. A run killed mid-flight (job timeout,
      # manual cancel) has started steps and IS one. Distinguish via the jobs API.
      - name: Classify cancellation
        id: classify
        run: |
          REAL=true
          if [ "$WF_CONCLUSION" = "cancelled" ]; then
            STARTED=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WF_RUN_ID/jobs" \
              --jq '[.jobs[] | select((.steps // []) | length > 0)] | length' 2>/dev/null || echo "unknown")
            if [ "$STARTED" = "0" ]; then
              REAL=false
              echo "Run was cancelled before any job started (superseded in its concurrency queue) — not alerting."
            fi
          fi
          echo "real=$REAL" >> "$GITHUB_OUTPUT"

      - name: Raise GitHub issue on workflow failure
        if: steps.classify.outputs.real == 'true'
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          # One title per (workflow + day) whatever the conclusion, so a day
          # with both a failure and a cancellation opens ONE issue, not two.
          TITLE="🚨 Workflow failed: ${WF_NAME} on ${TODAY}"
          # Dedup per (workflow + day): repeated same-day failures don't spam,
          # but a different workflow or a new day still alerts. A repeat is
          # recorded as a comment so the count of bad runs stays visible.
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"${TITLE}\"" --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            BODY=$(printf 'Automation workflow **%s** concluded with **%s**.\n\n- Run: %s\n- Branch: %s\n- Run #: %s\n\n`cancelled` / `timed_out` usually means the job hit its `timeout-minutes` or was superseded — the work did NOT complete.\n\n---\nAuto-generated by the failure watchdog. Open the run, fix the root cause, and re-trigger via `workflow_dispatch` if needed. Trading crons are staggered + idempotent, so the next scheduled run retries automatically.' \
              "$WF_NAME" "$WF_CONCLUSION" "$WF_URL" "$WF_BRANCH" "$WF_RUN")
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --label "automation,alert" --assignee "${{ github.repository_owner }}" --body "$BODY" \
            || gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          else
            echo "Issue #${EXISTING} already open for ${WF_NAME} on ${TODAY} — adding a comment, not a duplicate."
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" \
              --body "Another run concluded **${WF_CONCLUSION}**: ${WF_URL} (run #${WF_RUN})" \
              || echo "Comment failed (non-fatal)"
          fi

      - name: Optional Slack alert
        if: env.SLACK_WEBHOOK_URL != '' && steps.classify.outputs.real == 'true'
        run: |
          payload=$(python3 -c "import json,os; print(json.dumps({'text': '🚨 Auto Trading workflow ' + os.environ['WF_CONCLUSION'].upper() + ': ' + os.environ['WF_NAME'] + '\n' + os.environ['WF_URL']}))")
          curl -sf -X POST -H 'Content-Type: application/json' -d "$payload" "$SLACK_WEBHOOK_URL" \
            || echo "Slack post failed (non-fatal)"
