name: "P2 Capitol Shadow — Daily Scan & Trade"

on:
  schedule:
    # 10:15 AM ET morning scan. EDT=14:15 UTC, EST=15:15 UTC.
    # Afternoon re-scan 3:45 PM ET. EDT=19:45 UTC, EST=20:45 UTC.
    # Multiple staggered fires guard against GitHub Actions schedule delays/skips.
    # P2 is idempotent by design — only acts on new political disclosures.
    - cron: "15 14 * * 1-5"
    - cron: "30 14 * * 1-5"
    - cron: "15 15 * * 1-5"
    - cron: "30 15 * * 1-5"
    - cron: "45 19 * * 1-5"
    - cron: "0 20 * * 1-5"
    - cron: "45 20 * * 1-5"
    - cron: "0 21 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "scan"
        type: choice
        options: [scan, monitor, weekly]

permissions:
  contents: write

concurrency:
  group: p2-trading
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install -g @anguslin/mcp-capitol-trades

      - name: Create Alpaca config
        run: |
          cat > political-copy-bot/config/alpaca_config.json << 'CONF'
          {
            "api_key": "${{ secrets.P2_API_KEY }}",
            "api_secret": "${{ secrets.P2_API_SECRET }}",
            "base_url": "https://paper-api.alpaca.markets",
            "data_url": "https://data.alpaca.markets"
          }
          CONF

      - name: Check market open
        id: market
        run: |
          python3 -c "
          import json
          with open('political-copy-bot/config/alpaca_config.json') as f:
              cfg = json.load(f)
          import requests
          h = {'APCA-API-KEY-ID': cfg['api_key'], 'APCA-API-SECRET-KEY': cfg['api_secret']}
          clock = requests.get('https://paper-api.alpaca.markets/v2/clock', headers=h, timeout=10).json()
          is_open = clock.get('is_open', False)
          print(f'Market open: {is_open}')
          with open('$GITHUB_OUTPUT', 'a') as f:
            f.write(f'is_open={str(is_open).lower()}\n')
          "

      - name: Run scan & trade
        if: steps.market.outputs.is_open == 'true'
        run: |
          cd "$GITHUB_WORKSPACE/political-copy-bot"
          export PYTHONPATH="$GITHUB_WORKSPACE/political-copy-bot/scripts"
          python3 scripts/politician_bot.py ${{ github.event.inputs.mode || 'scan' }}

      - name: Save daily snapshot to Supabase
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Optional telemetry — must NEVER fail the trading job.
          python3 scripts/save_to_supabase.py \
            --portfolio-id portfolio_2 \
            --state-file political-copy-bot/data/portfolio_state.json \
            --api-key "${{ secrets.P2_API_KEY }}" \
            --api-secret "${{ secrets.P2_API_SECRET }}" || echo "Supabase snapshot skipped/failed (non-fatal)"

      - name: Validate P2 output
        if: always()
        run: |
          echo "=== P2 CAPITOL SHADOW EXECUTION SUMMARY ==="
          TODAY=$(date -u +%Y-%m-%d)
          echo "Date: $TODAY UTC"
          if [ -f political-copy-bot/data/trade_log.json ]; then
            python3 -c "
          import json
          today = '${TODAY}'
          log = json.load(open('political-copy-bot/data/trade_log.json'))
          today_trades = [t for t in log if t.get('timestamp','').startswith(today)]
          print(f'Trades logged today: {len(today_trades)}')
          "
          else
            echo "WARNING: P2 trade_log.json not found"
          fi
          echo "=== END SUMMARY ==="

      - name: Sync data to dashboard for Vercel deploy
        if: always()
        run: |
          mkdir -p dashboard/data dashboard/event-driven-bot/data dashboard/political-copy-bot/data dashboard/journal dashboard/config
          cp data/*.json dashboard/data/ 2>/dev/null || true
          cp event-driven-bot/data/*.json dashboard/event-driven-bot/data/ 2>/dev/null || true
          cp political-copy-bot/data/*.json dashboard/political-copy-bot/data/ 2>/dev/null || true
          cp journal/*.json dashboard/journal/ 2>/dev/null || true
          cp config/risk_limits.json config/watchlist.json dashboard/config/ 2>/dev/null || true
          echo "Dashboard data synced"

      - name: Commit state
        if: always()
        run: |
          git config user.name "Auto Trading Bot"
          git config user.email "bot@autotrading.local"
          git add political-copy-bot/data/ political-copy-bot/journal/ -f 2>/dev/null || true
          git add dashboard/data/ dashboard/event-driven-bot/data/ dashboard/political-copy-bot/data/ dashboard/journal/ dashboard/config/ -f 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "P2: $(date -u +%Y-%m-%d) scan & trade"
            PUSHED=1
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then
                echo "Push succeeded on attempt $i"
                PUSHED=0
                break
              fi
              echo "Push attempt $i failed, retrying in 5s..."
              sleep 5
            done
            if [ "$PUSHED" -ne 0 ]; then
              echo "WARNING: All push attempts failed — state saved locally but not synced to remote"
            fi
          fi
