name: "CI — Lint & Tests"

# Quality gate: every push and PR must pass lint + tests before code is trusted.
# This is the gate that would have caught the risk_officer KeyError that silently
# broke P1 trading on 2026-05-29.
on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "shared/**"
      - "event-driven-bot/scripts/**"
      - "political-copy-bot/scripts/**"
      - "tests/**"
      - "config/**"
      - "dashboard/server.js"
      - "dashboard/package*.json"
      - "dashboard/test/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/ci.yml"
  pull_request:
  workflow_dispatch:
  # Daily safety net: state/config commits by the bots never touch the path
  # filter above, so a latent red main (as on 2026-10-03..10-23) must still surface.
  schedule:
    - cron: "15 11 * * 1-5"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint (real-bug codes)
        run: python3 -m ruff check scripts/ shared/ event-driven-bot/scripts/ political-copy-bot/scripts/

      - name: Pytest
        run: python3 -m pytest tests/ -v

  dashboard-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install dashboard dependencies (lockfile)
        working-directory: dashboard
        run: npm ci --omit=dev
      - name: Dashboard API security tests
        working-directory: dashboard
        run: node --test test/*.test.js
