name: "P1 Self Improving Brain — Weekly Review"

on:
  schedule:
    # Friday 4:30 PM ET = 20:30 UTC
    - cron: "30 20 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-pipeline
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests

      - name: Create Alpaca config
        run: |
          cat > config/alpaca_config.json << 'CONF'
          {
            "api_key": "${{ secrets.P1_API_KEY }}",
            "api_secret": "${{ secrets.P1_API_SECRET }}",
            "base_url": "https://paper-api.alpaca.markets",
            "data_url": "https://data.alpaca.markets"
          }
          CONF

      - name: Run weekly review
        run: |
          cd "$GITHUB_WORKSPACE"
          export PYTHONPATH="$GITHUB_WORKSPACE/scripts"
          python3 scripts/autonomous_runner.py weekly-review

      - name: Commit state
        if: always()
        run: |
          git config user.name "Auto Trading Bot"
          git config user.email "bot@autotrading.local"
          git add data/ journal/ -f 2>/dev/null || true
          git diff --staged --quiet || git commit -m "P1: $(date -u +%Y-%m-%d) weekly review"
          for i in 1 2 3; do git pull --rebase origin main 2>/dev/null; git push && break || sleep 5; done
