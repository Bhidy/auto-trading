name: "P1 Self Improving Brain — Weekly Review"

on:
  schedule:
    # Friday 4:30 PM ET. EDT = 20:30 UTC, EST = 21:30 UTC. Both lines fire; the
    # review overwrites journal/weekly-<week>.json, so the later run is final.
    - cron: "30 20 * * 5"
    - cron: "30 21 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p1-weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create Alpaca config
        run: |
          cat > config/alpaca_config.json << 'CONF'
          {
            "api_key": "${{ secrets.P1_API_KEY }}",
            "api_secret": "${{ secrets.P1_API_SECRET }}",
            "base_url": "https://paper-api.alpaca.markets",
            "data_url": "https://data.alpaca.markets"
          }
          CONF

      - name: Run weekly review
        run: |
          cd "$GITHUB_WORKSPACE"
          export PYTHONPATH="$GITHUB_WORKSPACE/scripts"
          python3 scripts/autonomous_runner.py weekly-review

      - name: Sync data to dashboard for Vercel deploy
        if: always()
        run: |
          mkdir -p dashboard/data dashboard/event-driven-bot/data dashboard/political-copy-bot/data dashboard/journal dashboard/config
          cp data/*.json dashboard/data/ 2>/dev/null || true
          cp event-driven-bot/data/*.json dashboard/event-driven-bot/data/ 2>/dev/null || true
          cp political-copy-bot/data/*.json dashboard/political-copy-bot/data/ 2>/dev/null || true
          cp journal/*.json dashboard/journal/ 2>/dev/null || true
          cp config/risk_limits.json config/watchlist.json dashboard/config/ 2>/dev/null || true
          echo "Dashboard data synced"

      - name: Commit state
        if: always()
        run: |
          bash scripts/commit_and_push.sh "P1: weekly review" data journal
