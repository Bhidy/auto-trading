name: "P1 Self Improving Brain — Daily Trading"

on:
  schedule:
    # Morning research: 9:45 AM ET = 13:45 UTC (M-F)
    - cron: "45 13 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "full"
        type: choice
        options: [full, morning-research, trading-session, intraday-monitor, end-of-day-journal, weekly-review]

permissions:
  contents: write

concurrency:
  group: trading-pipeline
  cancel-in-progress: false

jobs:
  trading:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests

      - name: Create Alpaca config
        run: |
          cat > config/alpaca_config.json << 'CONF'
          {
            "api_key": "${{ secrets.P1_API_KEY }}",
            "api_secret": "${{ secrets.P1_API_SECRET }}",
            "base_url": "https://paper-api.alpaca.markets",
            "data_url": "https://data.alpaca.markets"
          }
          CONF

      - name: Check market status
        id: market
        run: |
          python3 -c "
          import requests, json
          h = {'APCA-API-KEY-ID': '${{ secrets.P1_API_KEY }}', 'APCA-API-SECRET-KEY': '${{ secrets.P1_API_SECRET }}'}
          clock = requests.get('https://paper-api.alpaca.markets/v2/clock', headers=h).json()
          is_open = clock.get('is_open', False)
          print(f'Market open: {is_open}')
          with open('$GITHUB_OUTPUT', 'a') as f:
            f.write(f'is_open={str(is_open).lower()}\n')
          "

      - name: Run morning research
        if: steps.market.outputs.is_open == 'true' && (github.event.schedule || github.event.inputs.mode == 'full' || github.event.inputs.mode == 'morning-research')
        run: |
          cd "$GITHUB_WORKSPACE"
          export PYTHONPATH="$GITHUB_WORKSPACE/scripts"
          python3 scripts/autonomous_runner.py morning-research

      - name: Run trading session
        if: steps.market.outputs.is_open == 'true' && (github.event.schedule || github.event.inputs.mode == 'full' || github.event.inputs.mode == 'trading-session')
        run: |
          cd "$GITHUB_WORKSPACE"
          export PYTHONPATH="$GITHUB_WORKSPACE/scripts"
          python3 scripts/autonomous_runner.py trading-session

      - name: Commit state files
        if: always()
        run: |
          git config user.name "Auto Trading Bot"
          git config user.email "bot@autotrading.local"
          git add data/ journal/ -f 2>/dev/null || true
          git diff --staged --quiet || git commit -m "P1: $(date -u +%Y-%m-%d) trading session state update"
          for i in 1 2 3; do git pull --rebase origin main 2>/dev/null; git push && break || sleep 5; done
