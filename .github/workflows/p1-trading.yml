name: "P1 Self Improving Brain — Daily Trading"

on:
  schedule:
    # Morning research: 9:45 AM ET. EDT (summer) = 13:45 UTC, EST (winter) = 14:45 UTC.
    # Multiple staggered fires guard against GitHub Actions schedule delays/skips.
    # Idempotency guard below prevents double-trading: only the first fire that finds
    # no fresh signals.json runs; subsequent fires no-op via dedup gate.
    - cron: "45 13 * * 1-5"
    - cron: "0 14 * * 1-5"
    - cron: "15 14 * * 1-5"
    - cron: "45 14 * * 1-5"
    - cron: "0 15 * * 1-5"
    - cron: "15 15 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "full"
        type: choice
        options: [full, morning-research, trading-session, intraday-monitor, end-of-day-journal, weekly-review]

permissions:
  contents: write

concurrency:
  group: p1-trading
  cancel-in-progress: false

jobs:
  trading:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create Alpaca config
        run: |
          cat > config/alpaca_config.json << 'CONF'
          {
            "api_key": "${{ secrets.P1_API_KEY }}",
            "api_secret": "${{ secrets.P1_API_SECRET }}",
            "base_url": "https://paper-api.alpaca.markets",
            "data_url": "https://data.alpaca.markets"
          }
          CONF

      - name: Check market status
        id: market
        run: |
          python3 -c "
          import json
          with open('config/alpaca_config.json') as f:
              cfg = json.load(f)
          import requests
          h = {'APCA-API-KEY-ID': cfg['api_key'], 'APCA-API-SECRET-KEY': cfg['api_secret']}
          clock = requests.get('https://paper-api.alpaca.markets/v2/clock', headers=h, timeout=10).json()
          is_open = clock.get('is_open', False)
          print(f'Market open: {is_open}')
          with open('$GITHUB_OUTPUT', 'a') as f:
            f.write(f'is_open={str(is_open).lower()}\n')
          "

      - name: Dedup — skip if today already traded
        id: dedup
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          ALREADY=false
          if [ -f data/signals.json ]; then
            SIG_DATE=$(python3 -c "import json; d=json.load(open('data/signals.json')); print((d.get('timestamp') or '')[:10])" 2>/dev/null || echo "")
            if [ "$SIG_DATE" = "$TODAY" ]; then
              ALREADY=true
              echo "Today's session already ran (signals.json timestamp=$SIG_DATE). Skipping."
            fi
          fi
          # Manual dispatch always runs (operator intent overrides dedup)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ALREADY=false
            echo "workflow_dispatch — bypassing dedup."
          fi
          echo "already_ran=$ALREADY" >> $GITHUB_OUTPUT

      - name: Run morning research
        id: research
        if: steps.market.outputs.is_open == 'true' && steps.dedup.outputs.already_ran != 'true' && (github.event.schedule || github.event.inputs.mode == 'full' || github.event.inputs.mode == 'morning-research')
        run: |
          cd "$GITHUB_WORKSPACE"
          export PYTHONPATH="$GITHUB_WORKSPACE/scripts"
          python3 scripts/autonomous_runner.py morning-research
          echo "Research completed"

      - name: Run trading session
        id: trading_session
        if: steps.market.outputs.is_open == 'true' && steps.dedup.outputs.already_ran != 'true' && steps.research.outcome != 'failure' && (github.event.schedule || github.event.inputs.mode == 'full' || github.event.inputs.mode == 'trading-session')
        run: |
          cd "$GITHUB_WORKSPACE"
          export PYTHONPATH="$GITHUB_WORKSPACE/scripts"
          python3 scripts/autonomous_runner.py trading-session
          echo "Trading session completed"

      - name: Validate trading output
        if: always()
        run: |
          echo "=== P1 TRADING EXECUTION SUMMARY ==="
          TODAY=$(date -u +%Y-%m-%d)
          echo "Date: $TODAY UTC"

          if [ -f data/signals.json ]; then
            SIG_TS=$(python3 -c "import json; d=json.load(open('data/signals.json')); print(d.get('timestamp','UNKNOWN'))")
            SIG_COUNT=$(python3 -c "import json; d=json.load(open('data/signals.json')); s=[x for x in d.get('signals',[]) if x.get('signal')=='BUY']; print(f'{len(s)} BUY signals')")
            echo "Signals timestamp: $SIG_TS"
            echo "Signals: $SIG_COUNT"
          else
            echo "WARNING: signals.json not found — research may have failed"
          fi

          if [ -f data/trade_log.json ]; then
            TODAY_TRADES=$(python3 -c "
          import json
          today = '${TODAY}'
          log = json.load(open('data/trade_log.json'))
          today_trades = [t for t in log if t.get('timestamp','').startswith(today)]
          print(len(today_trades))
          ")
            echo "Trades logged today: $TODAY_TRADES"
          else
            echo "WARNING: trade_log.json not found"
          fi

          if [ -f data/portfolio_state.json ]; then
            python3 -c "
          import json
          ps = json.load(open('data/portfolio_state.json'))
          print(f\"Portfolio equity: \${ps.get('equity',0):,.2f}\")
          print(f\"Positions held: {len(ps.get('positions',{}))}\")
          print(f\"Trades today: {ps.get('trades_today',0)}\")
          print(f\"Day P&L: \${ps.get('day_pnl',0):+,.2f}\")
          print(f\"Halted: {ps.get('halted',False)}\")
          "
          fi
          echo "=== END SUMMARY ==="

      - name: Sync data to dashboard for Vercel deploy
        if: always()
        run: |
          mkdir -p dashboard/data dashboard/event-driven-bot/data dashboard/political-copy-bot/data dashboard/journal dashboard/config
          cp data/*.json dashboard/data/ 2>/dev/null || true
          cp event-driven-bot/data/*.json dashboard/event-driven-bot/data/ 2>/dev/null || true
          cp political-copy-bot/data/*.json dashboard/political-copy-bot/data/ 2>/dev/null || true
          cp journal/*.json dashboard/journal/ 2>/dev/null || true
          cp config/risk_limits.json config/watchlist.json dashboard/config/ 2>/dev/null || true
          echo "Dashboard data synced"

      - name: Commit state files
        if: always()
        run: |
          git config user.name "Auto Trading Bot"
          git config user.email "bot@autotrading.local"
          git add data/ journal/ -f 2>/dev/null || true
          git add dashboard/data/ dashboard/event-driven-bot/data/ dashboard/political-copy-bot/data/ dashboard/journal/ dashboard/config/ -f 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "P1: $(date -u +%Y-%m-%d) trading session state update"
            PUSHED=1
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then
                echo "Push succeeded on attempt $i"
                PUSHED=0
                break
              fi
            done
            if [ "$PUSHED" -ne 0 ]; then
              echo "::error::All push attempts failed after retries — state NOT synced to remote; failing the run so the failure-alert watchdog fires (idempotent client_order_ids + EOD reconciliation keep the broker safe)."
              exit 1
            fi
          fi
