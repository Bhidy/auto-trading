<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <script src="/assets/starta-theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live-Readiness | Auto Trading</title>
    <meta name="description" content="Which strategy versions have earned live capital: the evidence band behind each verdict, every gate, every strategy. Paper only.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/assets/news-public.css">
    <link rel="stylesheet" href="/assets/portfolio.css">
    <style>
        /* Live-Readiness — "Verdict Room". Every colour derives from a RiseWealth
           token (news-public.css / portfolio.css). The whole page, hero included,
           follows the theme: light ground in light mode, brand-ink in dark. */
        .rx {
            --rx-serif: 'DM Serif Display', Georgia, serif;
            --rx-ui: 'Manrope', system-ui, sans-serif;
            --rx-mono: 'IBM Plex Mono', 'JetBrains Mono', ui-monospace, monospace;
            --rx-pos: var(--pf-green);
            --rx-neg: var(--pf-red);
            --rx-wait: #A33A14;                       /* solar ramp 9 — AA on light */
            --rx-wait-soft: rgba(229, 90, 31, 0.10);
            --rx-card: var(--surface);
            --rx-sunk: color-mix(in srgb, var(--page) 55%, var(--surface));
            --rx-line-strong: rgba(26, 15, 8, 0.13);
            --rx-sh: 0 1px 2px rgba(26, 15, 8, 0.04), 0 10px 28px rgba(122, 107, 94, 0.10);
            --rx-ease: cubic-bezier(.23, 1, .32, 1);
            --rx-acc-ink: var(--teal-dark);           /* small accent TEXT: AA 4.5:1 on light grounds */
            /* chart palette (body) */
            --c-ink: var(--ink); --c-muted: var(--muted); --c-line: rgba(26, 15, 8, 0.12);
            --c-acc: var(--teal); --c-acc-ink: var(--teal-dark); --c-pos: var(--pf-green); --c-neg: var(--pf-red); --c-wait: #A33A14; --c-bg: var(--surface);
            font-family: var(--rx-ui); color: var(--ink); background: var(--page);
        }
        [data-theme="dark"] .rx {
            --rx-wait: #FFA86A; --rx-wait-soft: rgba(255, 138, 61, 0.14);
            --rx-line-strong: rgba(255, 255, 255, 0.14);
            --rx-sh: 0 1px 2px rgba(0, 0, 0, 0.35), 0 12px 30px rgba(0, 0, 0, 0.32);
            --c-line: rgba(255, 255, 255, 0.12); --c-wait: #FFA86A; --c-pos: #22c55e; --c-neg: #ef4444;
            --rx-acc-ink: var(--teal); --c-acc-ink: var(--teal);
        }
        .rx-wrap { max-width: 1240px; margin: 0 auto; padding: 0 clamp(16px, 3.2vw, 40px); box-sizing: border-box; }
        .rx .num, .rx .mono { font-family: var(--rx-mono); font-variant-numeric: tabular-nums; }
        .rx h1, .rx h2, .rx h3 { font-family: var(--rx-serif); font-weight: 400; margin: 0; text-wrap: balance; }
        [dir="rtl"] .rx h1, [dir="rtl"] .rx h2, [dir="rtl"] .rx h3 { font-family: 'IBM Plex Sans Arabic', var(--rx-ui); font-weight: 700; letter-spacing: 0; }
        .rx p { text-wrap: pretty; }
        .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

        /* ── Hero: brand ink band ── */
        .rx-hero {
            --h-bg: var(--page); --h-card: var(--surface); --h-ink: var(--ink); --h-muted: var(--muted); --h-line: var(--line);
            --h-big: var(--teal); --h-of: rgba(26, 15, 8, 0.22); --h-sh: var(--rx-sh);
            background: var(--h-bg); color: var(--h-ink); padding: clamp(96px, 11vw, 132px) 0 clamp(40px, 6vw, 72px);
            border-bottom: 1px solid var(--h-line);
        }
        [data-theme="dark"] .rx-hero {
            --h-bg: #140C07; --h-card: #1A0F08; --h-ink: #FFF1E8; --h-muted: #A39A92; --h-line: rgba(255, 255, 255, 0.08);
            --h-big: #FF8A3D; --h-of: #6B5F55; --h-sh: none;
            --c-ink: #FFF1E8; --c-muted: #A39A92; --c-line: rgba(255, 255, 255, 0.12); --c-acc: #FF8A3D;
            --c-pos: #22c55e; --c-neg: #ef4444; --c-wait: #FFA86A; --c-bg: #1A0F08; --c-acc-ink: #FF8A3D;
        }
        .rx-top { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: clamp(24px, 4vw, 48px); align-items: end; }
        .rx-top h1 { font-size: clamp(2.6rem, 6vw, 4.5rem); line-height: 1.04; letter-spacing: -0.02em; }
        .rx-lede { margin: 18px 0 0; max-width: 34rem; font-size: clamp(1rem, 1.4vw, 1.15rem); line-height: 1.55; color: var(--h-muted); }
        .rx-count { display: flex; align-items: flex-end; gap: 18px; justify-content: flex-end; }
        .rx-count .big { font-family: var(--rx-serif); font-size: clamp(6rem, 13vw, 10.5rem); line-height: .9; color: var(--h-big); }
        .rx-count .big.go { color: var(--c-pos); }
        .rx-count .of { font-family: var(--rx-serif); font-size: clamp(2.4rem, 4.5vw, 3.5rem); color: var(--h-of); }
        .rx-count p { margin: 0 0 14px; max-width: 12rem; font-size: 15px; line-height: 1.45; }
        .rx-lead { margin-top: clamp(32px, 5vw, 52px); background: var(--h-card); border: 1px solid var(--h-line); border-radius: 18px; box-shadow: var(--h-sh); padding: clamp(18px, 2.4vw, 28px); }
        .rx-lead-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 18px 28px; }
        .rx-cap { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--h-muted); }
        [dir="rtl"] .rx-cap, [dir="rtl"] .rx-kick { letter-spacing: 0; }
        .rx-lead h2 { margin-top: 8px; font-size: clamp(1.5rem, 2.6vw, 2rem); letter-spacing: -0.01em; }
        .rx-lead h2 .mono { font-size: 13px; color: var(--h-muted); margin-inline-start: 8px; }
        .rx-stats { display: flex; flex-wrap: wrap; gap: 14px 30px; }
        .rx-stats dt { font-size: 12px; color: var(--h-muted); }
        .rx-stats dd { margin: 4px 0 0; font-family: var(--rx-mono); font-size: 22px; font-weight: 600; }
        .rx-stats dd small { font-size: 12px; color: var(--h-muted); font-weight: 500; }
        .rx-stats dd.acc { color: var(--c-acc-ink); }
        .rx-chart { position: relative; margin-top: 18px; min-height: 120px; outline: none; }
        .rx-chart:focus-visible { box-shadow: 0 0 0 2px var(--c-acc); border-radius: 8px; }
        .rx-note { margin: 12px 0 0; font-size: 14px; color: var(--h-muted); }
        .rx-empty-chart { display: grid; place-items: center; min-height: 160px; border: 1px dashed var(--c-line); border-radius: 12px; color: var(--c-muted); font-size: 14px; text-align: center; padding: 16px; }

        /* ── Sections ── */
        .rx-sec { margin-top: clamp(48px, 7vw, 80px); }
        .rx-sec:last-child { padding-bottom: clamp(56px, 7vw, 96px); }
        .rx-sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 14px 24px; }
        .rx-sec-head h2 { font-size: clamp(1.75rem, 3vw, 2.25rem); letter-spacing: -0.01em; }
        .rx-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 12px; color: var(--muted); }
        .rx-legend span { display: inline-flex; align-items: center; gap: 7px; }
        #alerts:not(:empty) { margin-top: 24px; display: grid; gap: 10px; }
        .rd-alert { border-radius: 12px; padding: .8rem 1rem; border: 1px solid var(--rx-neg); background: var(--pf-red-soft); font-size: .88rem; line-height: 1.55; }
        .rd-alert.warn { border-color: var(--rx-wait); background: var(--rx-wait-soft); }

        /* status glyphs: shape AND colour (colour-blind safe) */
        .gl { display: inline-block; width: 12px; height: 12px; border-radius: 50%; box-sizing: border-box; vertical-align: middle; }
        .gl-pass { background: var(--rx-pos); }
        .gl-insufficient { border: 1.5px solid var(--c-acc); background: linear-gradient(90deg, var(--c-acc) 50%, transparent 50%); }
        [dir="rtl"] .gl-insufficient { background: linear-gradient(270deg, var(--c-acc) 50%, transparent 50%); }
        .gl-fail { border-radius: 2px; background: var(--rx-neg); }
        .gl-not_measured { border: 1.5px dashed var(--muted); }
        .gl-not_applicable { width: 4px; height: 4px; background: var(--rx-line-strong); }
        .gl-unknown { border: 1.5px solid var(--ink); }
        .gl-soft { opacity: .38; }

        /* ── Matrix ── */
        .mx-box { margin-top: 22px; border: 1px solid var(--line); border-radius: 16px; background: var(--rx-card); box-shadow: var(--rx-sh); overflow-x: auto; position: relative; }
        .mx { width: 100%; min-width: 1060px; border-collapse: collapse; font-size: 13px; }
        .mx th { font-weight: 500; color: var(--muted); }
        .mx .grp th { font-family: var(--rx-ui); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; text-align: start; padding: 16px 8px 4px; }
        [dir="rtl"] .mx .grp th { letter-spacing: 0; }
        .mx .cols th { font-family: var(--rx-mono); font-size: 10px; padding: 0 3px 12px; text-align: center; white-space: nowrap; }
        .mx .cols th:first-child, .mx td:first-child { text-align: start; padding-inline: 20px 12px; }
        .mx .sep { border-inline-start: 1px solid var(--line); }
        .mx tbody tr { border-top: 1px solid var(--line); transition: background .2s var(--rx-ease); }
        .mx tbody tr:hover { background: var(--rx-sunk); }
        .mx td { padding: 10px 3px; text-align: center; }
        .mx td:first-child { position: sticky; inset-inline-start: 0; background: var(--rx-card); z-index: 1; white-space: nowrap; }
        .mx tbody tr:hover td:first-child { background: var(--rx-sunk); }
        .mx .bk { font-family: var(--rx-mono); font-size: 11px; color: var(--muted); margin-inline-end: 10px; }
        .mx .nm { font-weight: 650; }
        .mx-c { display: inline-grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px; background: transparent; cursor: pointer; }
        .mx-c:hover, .mx-c:focus-visible { background: var(--rx-wait-soft); outline: none; }
        .mx td.vd { text-align: end; padding-inline: 12px 20px; white-space: nowrap; }
        .mx td.vd .mono { font-size: 11px; color: var(--muted); margin-inline-end: 10px; }
        .vp { display: inline-block; border-radius: 999px; padding: 4px 10px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border: 1px solid transparent; }
        [dir="rtl"] .vp { letter-spacing: 0; }
        .vp-GO { background: var(--pf-green-soft); color: var(--rx-pos); border-color: var(--rx-pos); }
        .vp-NOT_READY { background: var(--rx-wait-soft); color: var(--rx-wait); }
        .vp-NOT_ELIGIBLE { border-color: var(--rx-line-strong); color: var(--muted); }
        .vp-BETA_SLEEVE { border-color: var(--ink); color: var(--ink); }
        .vp-FORWARD_TEST_PASS { border-color: var(--rx-pos); color: var(--rx-pos); }
        .vp-UNKNOWN { border: 1px dashed var(--ink); color: var(--ink); }
        .mx-tip { position: absolute; z-index: 5; max-width: 300px; background: var(--ink); color: var(--page); border-radius: 10px; padding: 10px 12px; font-size: 12px; line-height: 1.45; box-shadow: var(--rx-sh); pointer-events: none; }
        .mx-tip b { display: block; font-size: 13px; margin-bottom: 2px; }
        .mx-tip .mono { opacity: .8; }

        /* ── Book ── */
        .seg { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--rx-card); border: 1px solid var(--line); box-shadow: var(--rx-sh); }
        .seg button { font: 650 13px var(--rx-ui); color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 10px 18px; min-height: 44px; cursor: pointer; transition: background .25s var(--rx-ease), color .25s var(--rx-ease); }
        .seg button[aria-selected="true"] { background: var(--rx-acc-ink); color: #fff; }
        [data-theme="dark"] .seg button[aria-selected="true"] { background: var(--teal); color: #0E0805; }
        .seg button:focus-visible { outline: 2px solid var(--rx-acc-ink); outline-offset: 2px; }
        .kpis { margin-top: 22px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
        .kpis > div { background: var(--rx-card); padding: 16px 20px; }
        .kpis dt { font-size: 12px; color: var(--muted); }
        .kpis dd { margin: 6px 0 0; font-family: var(--rx-mono); font-size: clamp(18px, 2vw, 22px); font-weight: 600; }
        .up { color: var(--rx-pos); } .down { color: var(--rx-neg); }
        .g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 20px; }
        .panel { background: var(--rx-card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px 14px; box-shadow: var(--rx-sh); min-width: 0; }
        .panel h3 { font-family: var(--rx-ui); font-size: 13px; font-weight: 700; }
        [dir="rtl"] .panel h3 { font-family: 'IBM Plex Sans Arabic', var(--rx-ui); }
        .panel .rx-chart { margin-top: 10px; }

        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: var(--rx-card); border: 1px solid var(--line); border-radius: 18px; padding: clamp(18px, 2.2vw, 26px); box-shadow: var(--rx-sh); display: flex; flex-direction: column; gap: 18px; min-width: 0; transition: border-color .3s var(--rx-ease), box-shadow .3s var(--rx-ease); }
        .card:hover { border-color: var(--rx-line-strong); }
        .card-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
        .card-h h3 { font-size: clamp(1.35rem, 2vw, 1.65rem); line-height: 1.15; }
        .card-h .ver { margin: 6px 0 0; font-family: var(--rx-mono); font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
        .st { flex: none; border: 1px solid var(--rx-line-strong); border-radius: 999px; padding: 4px 10px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
        [dir="rtl"] .st { letter-spacing: 0; }
        .vrow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
        .vword { font-family: var(--rx-serif); font-size: clamp(2rem, 3.4vw, 2.6rem); line-height: 1; }
        [dir="rtl"] .vword { font-family: 'IBM Plex Sans Arabic', var(--rx-ui); font-weight: 700; }
        .vw-GO { color: var(--rx-pos); } .vw-NOT_READY { color: var(--teal); } .vw-NOT_ELIGIBLE { color: var(--muted); }
        .vw-BETA_SLEEVE { color: var(--ink); } .vw-FORWARD_TEST_PASS { color: var(--rx-pos); } .vw-UNKNOWN { color: var(--ink); }
        .vrow .bind { font-size: 14px; color: var(--muted); }
        .trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
        .trio .lab { margin: 6px 0 0; font-size: 11px; color: var(--muted); }
        .trio .v { margin: 0; font-family: var(--rx-mono); font-size: 16px; font-weight: 600; }
        .ringrow { display: flex; align-items: center; gap: 12px; }
        .rc-ring-bg { fill: none; stroke: var(--rx-line-strong); }
        .rc-ring-fg { fill: none; stroke: var(--teal); stroke-linecap: round; }
        .rc-ring-fg.done { stroke: var(--rx-pos); }
        .segs { display: flex; gap: 3px; margin-top: 8px; }
        .segs i { flex: 1; height: 6px; border-radius: 2px; background: var(--rx-line-strong); }
        .segs i.on { background: var(--teal); }
        .etav { margin: 0; font-size: 13px; font-weight: 650; line-height: 1.35; }
        .meter { position: relative; height: 8px; border-radius: 4px; background: var(--rx-line-strong); overflow: hidden; margin-top: 10px; }
        .meter i { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: 4px; background: var(--teal); }
        .tag { display: inline-block; font-size: 11px; color: var(--muted); border: 1px dashed var(--rx-line-strong); border-radius: 999px; padding: 3px 9px; }
        .noteline { margin: 0; font-size: 13px; line-height: 1.5; color: var(--muted); }
        .noteline b { color: var(--ink); font-weight: 650; }
        details.dl { border-top: 1px solid var(--line); padding-top: 12px; }
        details.dl > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 13px; font-weight: 700; color: var(--rx-acc-ink); }
        details.dl > summary::-webkit-details-marker { display: none; }
        details.dl > summary .caret { width: 10px; height: 10px; transition: transform .25s var(--rx-ease); }
        details.dl[open] > summary .caret { transform: rotate(90deg); }
        [dir="rtl"] details.dl > summary .caret { transform: scaleX(-1); }
        [dir="rtl"] details.dl[open] > summary .caret { transform: rotate(90deg); }
        .ledger { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 6px; }
        .ledger th { text-align: start; font-size: 11px; font-weight: 700; color: var(--muted); padding: 8px 6px; border-bottom: 1px solid var(--line); }
        .ledger td { padding: 9px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
        .ledger td.s { white-space: nowrap; }
        .ledger .gd { display: block; margin-top: 3px; font-size: 11.5px; color: var(--muted); line-height: 1.45; }
        .ledger .thv { font-family: var(--rx-mono); font-size: 11px; color: var(--muted); }
        .ledger tr.soft { opacity: .62; }
        .ledger tr.bind td:first-child { box-shadow: inset 3px 0 0 var(--teal); }
        [dir="rtl"] .ledger tr.bind td:first-child { box-shadow: inset -3px 0 0 var(--teal); }
        .narr p { margin: 8px 0 0; font-size: 13px; line-height: 1.6; color: var(--muted); }
        .q { color: var(--muted); font-weight: 500; }

        /* ── Footer ── */

        /* ── Charts (geometry from assets/readiness-charts.js; colours from tokens) ── */
        .rc { display: block; overflow: visible; font-family: var(--rx-ui); }
        .rc-gozone { fill: var(--c-pos); fill-opacity: .07; }
        .rc-grid, .rc-zero-soft { stroke: var(--c-line); stroke-width: 1; stroke-dasharray: 3 4; }
        .rc-tick { stroke: var(--c-line); }
        .rc-axis { fill: var(--c-muted); font-family: var(--rx-mono); font-size: 11px; }
        .rc-band { fill: var(--c-acc); fill-opacity: .17; }
        .rc-band-edge { fill: none; stroke: var(--c-acc); stroke-width: 1.25; }
        .rc-halo { fill: none; stroke: var(--c-bg); stroke-width: 5; stroke-linejoin: round; }
        .rc-est { fill: none; stroke: var(--c-ink); stroke-width: 1.75; stroke-linejoin: round; }
        .rc-zero { stroke: var(--c-pos); stroke-width: 1.5; stroke-dasharray: 6 4; }
        .rc-zero-lab { fill: var(--c-pos); font-family: var(--rx-mono); font-size: 11px; font-weight: 600; }
        .rc-end { fill: var(--c-acc); } .rc-end-pos { fill: var(--c-pos); } .rc-end-neg { fill: var(--c-neg); }
        .rc-lab { font-size: 12px; font-weight: 700; fill: var(--c-ink); }
        .rc-lab, .rc-zero-lab, .rc-off { paint-order: stroke; stroke: var(--c-bg); stroke-width: 4px; stroke-linejoin: round; }
        .rc-lab-band, .rc-l-book { fill: var(--c-acc-ink); } .rc-lab-pos { fill: var(--c-pos); } .rc-lab-neg { fill: var(--c-neg); }
        .rc-lab-wait { fill: var(--c-wait); } .rc-lab-ink { fill: var(--c-ink); }
        text.rc-l-spy { fill: var(--c-muted); }
        .rc-line { fill: none; stroke-width: 2; stroke-linejoin: round; }
        .rc-line.rc-l-book { stroke: var(--c-acc); fill: none; }
        .rc-line.rc-l-spy { stroke: var(--c-muted); stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
        .rc-dd { fill: var(--c-neg); fill-opacity: .13; }
        .rc-dd-edge { fill: none; stroke: var(--c-neg); stroke-width: 1.5; }
        .rc-limit { stroke: var(--c-wait); stroke-width: 1.25; stroke-dasharray: 4 3; }
        .rc-limit.rc-lab-neg { stroke: var(--c-neg); fill: none; }
        .rc-limit.rc-lab-wait { fill: none; }
        .rc-hit { fill: transparent; cursor: crosshair; }
        .rc-rule { stroke: var(--c-muted); stroke-width: 1; stroke-dasharray: 2 3; pointer-events: none; }
        .rc-tip { position: absolute; z-index: 4; background: var(--c-ink); color: var(--c-bg); border-radius: 8px; padding: 7px 10px; font-size: 12px; line-height: 1.45; white-space: nowrap; pointer-events: none; font-family: var(--rx-mono); }
        .rc-tip b { font-family: var(--rx-ui); }

        /* ── Motion: one engine (CSS), once, off under reduced motion ── */
        @media (prefers-reduced-motion: no-preference) {
            .rx:not(.rx-settled) .rx-chart svg.rc { animation: rx-wipe 1.1s var(--rx-ease) both; }
            .rx:not(.rx-settled) .rx-count .big { animation: rx-rise .9s var(--rx-ease) both; }
            .rx:not(.rx-settled) .card, .rx:not(.rx-settled) .panel { animation: rx-rise .7s var(--rx-ease) both; }
        }
        @keyframes rx-wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

        function showTip(btn) {
            var tip = document.getElementById('mxTip'), box = document.getElementById('mxBox');

            var html = '<b>' + esc(gateName({ id: btn.getAttribute('data-g') })) + '</b>' + esc(s ? sleeveName(s) : '') + ' · ' + (g ? statusLabel(g.status) : t('gs_not_applicable'));
            if (g) {
                html += '<br><span class="mono">' + t('tip_val') + ': ' + gateValue(g) + '</span>';
                if (g.threshold) html += '<br><span class="mono">' + t('tip_thr') + ': ' + EN(sym(g.threshold)) + '</span>';

            var b = btn.getBoundingClientRect(), o = box.getBoundingClientRect();

        // ── Book ──

        function ledger(s, openState) {
            var gates = s.gates || [], bind = s.binding_gate;

                return '<tr class="' + (g.id === bind ? 'bind ' : '') + (g.hard === false ? 'soft' : '') + '"><td>' + esc(gateName(g)) +

        function card(s, openState) {
            var vi = RL.verdictInfo(s.verdict), w = s.window || {}, th = report.thresholds || {};
            var bind = gateOf(s, s.binding_gate), eta = etaBlock(s, true);
            var trackNeed = th.min_track_sessions || 90, edgeNeed = th.min_edge_sessions || 60;
            var hard = (s.gates || []).filter(function (g) { return g.hard !== false && g.status !== 'not_applicable'; });
            var segs = hard.map(function (g) { return '<i class="' + (g.status === 'pass' ? 'on' : '') + '"></i>'; }).join('');
            var edgeN = RL.edgePoints(s);
            var evidence;
            var lead = RL.leadSleeve(report), e = s.edge || {};

            else if (lead && lead.id === s.id && edgeN >= 2) evidence = '<p class="noteline">' + tm('c_band_above', { lo: '<b>' + L(spct(e.cs_lower, 1)) + '</b>', hi: '<b>' + L(spct(e.cs_upper, 1)) + '</b>' }) + '</p>';

            else {

                    Math.min(100, Math.round(n / edgeNeed * 100)) + '%"></i></div></div>';

                '<div class="card-h"><div><h3 id="h-' + esc(s.id) + '">' + esc(sleeveName(s)) + '</h3><p class="ver" dir="ltr" lang="en">' + esc(s.version || s.id) + '</p></div>' +
                    '<span class="st">' + esc(key('st_', s.status)) + '</span></div>' +
                '<div class="vrow"><span class="vword vw-' + vi.cls + '">' + (vi.known ? esc(t('vd_' + vi.cls)) : esc(vi.raw || '—')) + '</span>' +

                    '<div><p class="v">' + L(s.gates_passed + '/' + s.gates_total) + '</p><div class="segs" aria-hidden="true">' + segs + '</div><p class="lab">' + t('c_gates') + '</p></div>' +

        function openStates() {

        function renderBook(keepOpen) {

                    if (r.ok && body && Array.isArray(body.sleeves)) { report = body; reportErr = null; return; }
                    // The server says there is no valid report: withdraw any verdict on screen.
                    if (body && body.unavailable) { report = null; reportErr = body.reason || 'absent'; return; }
                    // Transient failure (rate limit, 5xx): keep the last good report; its
                    // generated_at + stale warning stay visible, so nothing is overstated.
                    if (!report) reportErr = 'network';
                });
            }).catch(function () { if (!report) reportErr = 'network'; });
        }

        var tg = document.getElementById('langToggle');
        if (tg) tg.addEventListener('click', function () {
            lang = lang === 'ar' ? 'en' : 'ar';
            try { localStorage.setItem('starta-lang', lang); } catch (e) {}
            applyLang();
        });

        applyLang();
        loadReport().then(function () {
            renderAll(false);
            // One entrance only: later refreshes and resizes never re-animate.
            setTimeout(function () { document.getElementById('rx').classList.add('rx-settled'); }, 1400);
        });
        setInterval(function () { loadReport().then(function () { renderAll(true); }); }, 60000);
    })();
    </script>
</body>
</html>
